name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build frontend-only site
        run: |
          mkdir -p site
          cp index.html login.html messages.html trending.html history.html settings.html Rating.html site/
          cp bidding.php site/bidding.html
          cp -R assets site/assets
          touch site/.nojekyll
          python3 - <<'PY'
          from pathlib import Path

          for page in Path('site').glob('*.html'):
              text = page.read_text(encoding='utf-8-sig')
              text = text.replace('bidding.php', 'bidding.html')
              text = text.replace('/GrameenSetu/assets/', 'assets/')
              text = text.replace('/GrameenSetu/api/', 'api/')
              text = text.replace('href="/GrameenSetu/', 'href="')
              text = text.replace('src="/GrameenSetu/', 'src="')
              text = text.replace("fetch('/GrameenSetu/api/", "fetch('api/")
              if page.name == 'login.html':
                  text = text.replace('</body>', '  <script src="assets/js/frontend-demo.js"></script>\n</body>')
              page.write_text(text, encoding='utf-8')

          (Path('site') / 'rating.html').write_text(
              (Path('site') / 'Rating.html').read_text(encoding='utf-8'),
              encoding='utf-8'
          )
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
